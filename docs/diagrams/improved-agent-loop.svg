<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Improved agent workflow loop</title>
  <desc id="desc">Improved workflow with local checks, GitHub Actions, automated review, human review, fixes, and merge.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; rx: 8; }
      .decision { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; }
      .text { fill: #111827; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #374151; font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="960" height="560" />

  <rect class="box" x="60" y="45" width="160" height="58" />
  <text class="text" x="140" y="74">Stage starts</text>

  <rect class="box" x="280" y="45" width="160" height="58" />
  <text class="text" x="360" y="74">Implement</text>
  <text class="small" x="360" y="94">small change</text>

  <rect class="box" x="500" y="45" width="190" height="58" />
  <text class="text" x="595" y="69">Local checks</text>
  <text class="small" x="595" y="91">build, lint, test, types</text>

  <rect class="box" x="735" y="45" width="160" height="58" />
  <text class="text" x="815" y="74">Open PR</text>

  <rect class="box" x="125" y="170" width="190" height="58" />
  <text class="text" x="220" y="194">GitHub Actions</text>
  <text class="small" x="220" y="216">same checks in CI</text>

  <rect class="box" x="385" y="170" width="190" height="58" />
  <text class="text" x="480" y="194">Automated review</text>
  <text class="small" x="480" y="216">CodeRabbit / agent</text>

  <rect class="box" x="645" y="170" width="190" height="58" />
  <text class="text" x="740" y="194">Human review</text>
  <text class="small" x="740" y="216">product judgment</text>

  <path class="decision" d="M220 300 L320 338 L220 376 L120 338 Z" />
  <text class="text" x="220" y="333">Checks</text>
  <text class="text" x="220" y="353">pass?</text>

  <path class="decision" d="M610 300 L710 338 L610 376 L510 338 Z" />
  <text class="text" x="610" y="333">Approved?</text>

  <rect class="box" x="350" y="425" width="190" height="58" />
  <text class="text" x="445" y="454">Fix failure</text>
  <text class="small" x="445" y="474">or review feedback</text>

  <rect class="box" x="735" y="425" width="160" height="58" />
  <text class="text" x="815" y="454">Merge</text>

  <path class="line" d="M220 74 H280" />
  <path class="line" d="M440 74 H500" />
  <path class="line" d="M690 74 H735" />

  <path class="line" d="M815 103 V130 H220 V170" />
  <path class="line" d="M815 103 V130 H480 V170" />
  <path class="line" d="M815 103 V130 H740 V170" />

  <path class="line" d="M220 228 V300" />
  <path class="line" d="M480 228 V260 H610 V300" />
  <path class="line" d="M740 228 V260 H610 V300" />

  <path class="line" d="M220 376 V454 H350" />
  <text class="small" x="255" y="405">no</text>
  <path class="line" d="M610 376 V425 H540" />
  <text class="small" x="645" y="405">no</text>
  <path class="line" d="M445 425 V74 H500" />

  <path class="line" d="M320 338 H510" />
  <text class="small" x="415" y="323">yes</text>
  <path class="line" d="M710 338 H815 V425" />
  <text class="small" x="748" y="323">yes</text>
</svg>
