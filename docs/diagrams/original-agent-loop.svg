<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Original agent workflow loop</title>
  <desc id="desc">Dispatcher, builder, pull request, review, fixes, merge gates, merge, and final audit workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; rx: 8; }
      .decision { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; }
      .text { fill: #111827; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #374151; font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="960" height="540" />

  <rect class="box" x="70" y="45" width="170" height="58" />
  <text class="text" x="155" y="74">Dispatcher</text>
  <text class="small" x="155" y="94">find next stage</text>

  <rect class="box" x="305" y="45" width="170" height="58" />
  <text class="text" x="390" y="74">Builder</text>
  <text class="small" x="390" y="94">create branch</text>

  <rect class="box" x="540" y="45" width="170" height="58" />
  <text class="text" x="625" y="74">Implement</text>
  <text class="small" x="625" y="94">one stage only</text>

  <rect class="box" x="540" y="155" width="170" height="58" />
  <text class="text" x="625" y="184">Open PR</text>

  <rect class="box" x="305" y="155" width="170" height="58" />
  <text class="text" x="390" y="184">Review</text>
  <text class="small" x="390" y="204">CodeRabbit / agent</text>

  <path class="decision" d="M155 150 L245 184 L155 218 L65 184 Z" />
  <text class="text" x="155" y="179">Changes</text>
  <text class="text" x="155" y="199">requested?</text>

  <rect class="box" x="70" y="280" width="170" height="58" />
  <text class="text" x="155" y="309">Fix feedback</text>

  <rect class="box" x="305" y="280" width="170" height="58" />
  <text class="text" x="390" y="309">Merge gates</text>
  <text class="small" x="390" y="329">build, lint, checks</text>

  <rect class="box" x="540" y="280" width="170" height="58" />
  <text class="text" x="625" y="309">Merge PR</text>

  <path class="decision" d="M805 275 L895 309 L805 343 L715 309 Z" />
  <text class="text" x="805" y="304">More</text>
  <text class="text" x="805" y="324">stages?</text>

  <rect class="box" x="720" y="405" width="170" height="58" />
  <text class="text" x="805" y="434">Final audit</text>

  <path class="line" d="M240 74 H305" />
  <path class="line" d="M475 74 H540" />
  <path class="line" d="M625 103 V155" />
  <path class="line" d="M540 184 H475" />
  <path class="line" d="M305 184 H245" />
  <path class="line" d="M155 218 V280" />
  <text class="small" x="178" y="250">yes</text>
  <path class="line" d="M240 309 H305" />
  <path class="line" d="M390 280 V213" />
  <path class="line" d="M245 184 H305" />
  <text class="small" x="278" y="170">no</text>
  <path class="line" d="M475 309 H540" />
  <path class="line" d="M710 309 H715" />
  <path class="line" d="M805 275 V74 H710" />
  <text class="small" x="842" y="255">yes</text>
  <path class="line" d="M805 343 V405" />
  <text class="small" x="828" y="374">no</text>
</svg>
